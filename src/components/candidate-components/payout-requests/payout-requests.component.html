<div class="container-fluid py-4">
  <div class="mb-4">
    <h2 class="page-title">Payout Requests</h2>
    <p class="page-subtitle">
      Review and process pending payout requests for interviewers.
    </p>
  </div>

  <div class="row g-4">
    @for (request of payoutRequests; track request.id) {
      <div class="col-12">
        <div class="card shadow-sm">
          <div class="card-body d-flex justify-content-between align-items-center flex-wrap p-3">
            <div class="me-3">
              <h5 class="card-title mb-1">{{ request.interviewerName }}</h5>
              <p class="card-text text-muted mb-0 small">
                UPI ID: {{ request.upiId }}
              </p>
            </div>
            <div class="d-flex align-items-center gap-3 mt-3 mt-md-0">
              <span class="fw-bold fs-5">₹{{ request.amount }}</span>
              <button class="btn btn-primary d-flex align-items-center gap-1" (click)="processPayout(request)">
                <mat-icon>send</mat-icon>
                Process Payout
              </button>
            </div>
          </div>
        </div>
      </div>
    } @empty {
        <app-no-data></app-no-data>
    }
  </div>
</div>
