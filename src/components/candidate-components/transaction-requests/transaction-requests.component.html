<div class="container-fluid py-4">
  <div class="mb-4">
    <h2 class="page-title">Transaction Requests</h2>
    <p class="page-subtitle">
      Review and approve pending interview payments.
    </p>
  </div>

  <div class="row g-4">
    @for (request of pendingRequests; track request.id) {
      <div class="col-12">
        <div class="card shadow-sm">
          <div class="card-body d-flex justify-content-between align-items-center flex-wrap p-3">
            <div class="me-3">
              <h5 class="card-title mb-1">{{ request.candidateName }}</h5>
              <p class="card-text text-muted mb-0 small">
                {{ request.type }} Interview &bull; Transaction ID: {{ request.transactionId }}
              </p>
            </div>
            <div class="d-flex align-items-center gap-3 mt-3 mt-md-0">
              <span class="fw-bold fs-5">₹{{ request.amount }}</span>
              <button class="btn btn-success d-flex align-items-center gap-1" (click)="approveRequest(request.id)">
                <mat-icon>check_circle</mat-icon>
                Approve
              </button>
            </div>
          </div>
        </div>
      </div>
    } @empty {
        <app-no-data></app-no-data>
    }
  </div>
</div>
