
<div class="container-fluid pt-4">
  <h3 class="mb-1">Dashboard</h3>
  <p class="text-muted">Here's a summary of your activity.</p>

  <div class="row g-4">
    @for (card of dashboardCards; track card.title) {
      <div class="col-xl-3 col-md-6">
        <div class="card h-100 border-0 shadow-sm overflow-hidden dashboard-card" [ngClass]="'gradient-' + card.color">
          <div class="card-body d-flex flex-column justify-content-between text-white">
            <mat-icon class="card-icon-bg">{{card.icon}}</mat-icon>
            <h4 class="fw-bold mb-0">{{card.value}}</h4>
            <p class="mb-0 small">{{card.title}}</p>
          </div>
        </div>
      </div>
    }
  </div>

  <p class="text-muted">Catch any Important updates here</p>
  <app-no-data></app-no-data>
</div> -->

@if(isLoading){
  <app-loader></app-loader>
}
