<div class="container py-4">
  <h3 class="mb-4">Assign HR</h3>

  <div class="card shadow-sm border-0 h-100">
    <div class="card-header bg-transparent fw-bold">Select an HR</div>
    @if(!isLoading){
    <div class="card-body interviewer-list">
      @for (hr of hrs; track hr.id) {
      <div
        class="interviewer-card"
        [class.interviewer-selected]="isHrSelected(hr)"
        (click)="selectHr(hr)"
      >
        <div class="fw-bold">{{ hr.name }}</div>
        <div class="small text-muted">{{ hr.email }}</div>
      </div>
      } @empty {
      <p class="text-muted text-center m-0">No HRs found.</p>
      }
    </div>
    } @else {
    <div class="d-flex align-items-center justify-content-center h-75 p-5">
      <small class="text-secondary">Loading HR List...</small>
    </div>
    }
  </div>
  <div class="d-flex justify-content-end gap-2 mt-3">
    <button class="btn btn-outline-secondary" (click)="close()">Cancel</button>
    <button class="btn btn-primary" (click)="assignHr()" [disabled]="!selectedHr">Assign</button>
  </div>
</div>
